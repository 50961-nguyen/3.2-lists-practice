name: Autograding Tests

on:
  push:
  workflow_dispatch:
  repository_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Header comments
        id: header-comments
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Header comments
          setup-command: ""
          command: pytest test_list_practice.py::test_header_comments
          timeout: 5
          max-score: 1

      - name: roll_dice() docstring
        id: roll-dice-docstring
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: roll_dice() docstring
          setup-command: ""
          command: pytest test_list_practice.py::test_roll_dice_docstring
          timeout: 5
          max-score: 1

      - name: count_john()
        id: count-john
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: count_john()
          setup-command: ""
          command: pytest test_list_practice.py -k count_john
          timeout: 5
          max-score: 5

      - name: roll_dice()
        id: roll-dice
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: roll_dice()
          setup-command: ""
          command: pytest test_list_practice.py -k "roll_dice_returns_float or roll_dice_correct_average or roll_dice_stops_on_six or roll_dice_first_roll_six"
          timeout: 5
          max-score: 4

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          HEADER-COMMENTS_RESULTS: "${{steps.header-comments.outputs.result}}"
          ROLL-DICE-DOCSTRING_RESULTS: "${{steps.roll-dice-docstring.outputs.result}}"
          COUNT-JOHN_RESULTS: "${{steps.count-john.outputs.result}}"
          ROLL-DICE_RESULTS: "${{steps.roll-dice.outputs.result}}"
        with:
          runners: header-comments,roll-dice-docstring,count-john,roll-dice
